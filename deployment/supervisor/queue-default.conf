[program:ekspedisi-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ekspedisi-quran/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --timeout=300 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/ekspedisi-queue-default.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stopwaitsecs=3600